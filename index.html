<!doctype html>
<html lang="ru"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827"><link rel="manifest" href="manifest.json"><title>Стройка</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f2f4f7;color:#111827}
header{background:#111827;color:white;padding:18px 16px 20px;font-size:26px;font-weight:800;position:sticky;top:0;z-index:4}
main{max-width:950px;margin:auto;padding:14px 14px 105px}.card{background:white;border-radius:18px;padding:16px;margin-bottom:12px;box-shadow:0 2px 10px #0000000d}
h2{margin:0 0 12px;font-size:19px}.muted{color:#6b7280;font-size:13px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stat{font-size:26px;font-weight:800}.bar{height:11px;background:#e5e7eb;border-radius:20px;overflow:hidden}.fill{height:100%;background:#2563eb}
button{border:0;border-radius:12px;padding:10px 13px;background:#2563eb;color:white;font-weight:700}button.secondary{background:#e5e7eb;color:#111827}button.danger{background:#dc2626}
.row{display:flex;justify-content:space-between;gap:8px;align-items:center}.item{padding:13px 0;border-bottom:1px solid #eee}.item:last-child{border:0}.pill{padding:4px 8px;border-radius:20px;background:#e5e7eb;font-size:12px}
.section{display:grid;grid-template-columns:1fr 1fr;gap:9px}.section button{background:white;color:#111827;text-align:left;border:1px solid #e5e7eb;min-height:58px}
.list{display:flex;gap:8px;overflow:auto;margin-bottom:12px}.chip{white-space:nowrap;background:#e5e7eb;color:#111827;border:0}.chip.active{background:#2563eb;color:#fff}
.fab{position:fixed;right:18px;bottom:82px;width:58px;height:58px;border-radius:50%;font-size:29px;padding:0;box-shadow:0 5px 18px #0003;z-index:6}
nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #ddd;display:grid;grid-template-columns:repeat(6,1fr);padding:6px 2px calc(7px + env(safe-area-inset-bottom));z-index:5}
nav button{background:none;color:#6b7280;padding:6px 1px;font-size:10px}nav button.active{color:#2563eb}
.modal{position:fixed;inset:0;background:#0007;display:none;align-items:flex-end;z-index:10}.sheet{background:white;width:100%;border-radius:22px 22px 0 0;padding:18px;max-height:92vh;overflow:auto}.field{margin-bottom:10px}.field label{display:block;font-size:12px;color:#6b7280;margin-bottom:4px}.field input,.field select,.field textarea{width:100%;border:1px solid #d1d5db;border-radius:10px;padding:10px;font:inherit}.actions{display:flex;gap:8px;margin-top:14px}.actions button{flex:1}
.photo{max-width:100%;border-radius:12px;margin-top:8px}.month{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}.day{min-height:46px;background:#f8fafc;border-radius:8px;padding:5px;font-size:12px}.day b{display:block}.day.has{background:#dbeafe}.over{background:#fee2e2}
</style></head><body>
<header>🏠 Стройка</header><main id="app"></main><button class="fab" onclick="quickAdd()">＋</button><nav id="nav"></nav>
<div class="modal" id="modal"><div class="sheet" id="sheet"></div></div>
<script>
const KEY="stroika_v3";let db=JSON.parse(localStorage.getItem(KEY)||'{"works":[],"expenses":[],"materials":[],"journal":[]}');let page="home",filter="Все";
const sections=["Фундамент","Стены","Кровля","Отопление","Электрика","Водоснабжение","Канализация","Тёплый пол","Вентиляция","Кондиционирование","Санузел","Полы","Двери","Освещение","Умный дом","Прачечная","Отделка","Участок"];
const rooms=["Прихожая","Коридор","Кухня","Гостиная","Спальня","Детская 1","Детская 2","Душевая","Санузел","Прачечная","Котельная","Техническое помещение","Участок"];
const statuses=["Запланировано","В работе","Завершено","Приостановлено"],priorities=["Низкий","Обычный","Высокий","Критичный"],workers=["Я","Бригада","Подрядчик"];
const $=id=>document.getElementById(id);function save(){localStorage.setItem(KEY,JSON.stringify(db));render()}function e(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function nav(){ $("nav").innerHTML=[["home","Главная","⌂"],["works","Работы","✓"],["calendar","Календарь","▦"],["materials","Материалы","▤"],["money","Финансы","₽"],["journal","Журнал","☷"]].map(x=>`<button class="${page==x[0]?'active':''}" onclick="page='${x[0]}';render()">${x[2]}<br>${x[1]}</button>`).join("")}
function render(){nav();({home,works,calendar,materials,money,journal}[page])($("app"))}
function home(a){let total=db.works.length,done=db.works.filter(x=>x.status==="Завершено").length,p=total?Math.round(done/total*100):0,exp=db.expenses.reduce((s,x)=>s+Number(x.amount||0),0),buy=db.materials.filter(x=>!x.purchased).length;
a.innerHTML=`<div class="card"><h2>Дом 112 м²</h2><div class="row"><div class="stat">${p}%</div><div class="muted">${done} из ${total} работ</div></div><div class="bar"><div class="fill" style="width:${p}%"></div></div></div>
<div class="grid"><div class="card"><div class="muted">В работе</div><div class="stat">${db.works.filter(x=>x.status==="В работе").length}</div></div><div class="card"><div class="muted">Расходы</div><div class="stat">${exp.toLocaleString("ru-RU")} ₽</div></div><div class="card"><div class="muted">Купить</div><div class="stat">${buy}</div></div><div class="card"><div class="muted">Записей</div><div class="stat">${db.journal.length}</div></div></div>
<div class="card"><h2>Разделы</h2><div class="section">${sections.map(s=>`<button onclick="goSection('${s}')"><b>${s}</b><br><span class="muted">${db.works.filter(x=>x.section===s).length} работ</span></button>`).join("")}</div></div>
<div class="card"><h2>Ближайшие</h2>${db.works.filter(x=>x.status!=="Завершено").sort((a,b)=>(a.start||"9999").localeCompare(b.start||"9999")).slice(0,5).map(workRow).join("")||'<span class="muted">Добавь первую работу</span>'}</div>`}
function workRow(x){return `<div class="item"><div class="row"><b>${e(x.name)}</b><span class="pill">${e(x.status)}</span></div><div class="muted">${e(x.section)} · ${e(x.room||"")} · ${e(x.priority||"Обычный")} ${x.start?"· "+x.start:""}</div></div>`}
function works(a){let arr=filter==="Все"?db.works:db.works.filter(x=>x.section===filter);a.innerHTML=`<div class="card"><div class="row"><h2>Работы</h2><button onclick="addWork()">Добавить</button></div><div class="list"><button class="chip ${filter==="Все"?"active":""}" onclick="filter='Все';render()">Все</button>${sections.map(s=>`<button class="chip ${filter===s?"active":""}" onclick="filter='${s}';render()">${s}</button>`).join("")}</div>${arr.map((x,i)=>{let real=db.works.indexOf(x);return `<div class="item">${workRow(x)}<div class="actions"><button class="secondary" onclick="addWork(${real})">Изменить</button> <button class="danger" onclick="delWork(${real})">Удалить</button></div></div>`}).join("")||'<span class="muted">Работ пока нет</span>'}</div>`}
function calendar(a){let now=new Date(),y=now.getFullYear(),m=now.getMonth(),first=new Date(y,m,1).getDay();first=(first+6)%7;let days=new Date(y,m+1,0).getDate(),cells="";for(let i=0;i<first;i++)cells+=`<div></div>`;for(let d=1;d<=days;d++){let ds=`${y}-${String(m+1).padStart(2,"0")}-${String(d).padStart(2,"0")}`,ws=db.works.filter(x=>x.start===ds||x.end===ds|| (x.start&&x.end&&x.start<ds&&x.end>ds));cells+=`<div class="day ${ws.length?"has":""}"><b>${d}</b>${ws.length?`<span>${ws.length} раб.</span>`:""}</div>`}a.innerHTML=`<div class="card"><div class="row"><h2>${now.toLocaleDateString("ru-RU",{month:"long",year:"numeric"})}</h2><button onclick="addWork()">+ Работа</button></div><div class="month">${cells}</div></div><div class="card"><h2>Просроченные</h2>${db.works.filter(x=>x.end&&x.end<new Date().toISOString().slice(0,10)&&x.status!=="Завершено").map(workRow).join("")||'<span class="muted">Просроченных работ нет</span>'}</div>`}
function materials(a){a.innerHTML=`<div class="card"><div class="row"><h2>Материалы</h2><button onclick="addMaterial()">Добавить</button></div>${db.materials.map((x,i)=>`<div class="item"><div class="row"><b>${e(x.name)}</b><span class="pill">${x.purchased?"Куплено":"Купить"}</span></div><div class="muted">${e(x.section)} · ${x.qty} ${e(x.unit)} · ${Number(x.price||0).toLocaleString("ru-RU")} ₽</div><div class="actions"><button class="secondary" onclick="toggleMat(${i})">${x.purchased?"Вернуть в список":"Отметить купленным"}</button> <button class="danger" onclick="delMat(${i})">Удалить</button></div></div>`).join("")||'<span class="muted">Материалов пока нет</span>'}</div>`}
function money(a){let plan=db.works.reduce((s,x)=>s+Number(x.cost||0),0),fact=db.expenses.reduce((s,x)=>s+Number(x.amount||0),0);a.innerHTML=`<div class="grid"><div class="card"><div class="muted">План работ</div><div class="stat">${plan.toLocaleString("ru-RU")} ₽</div></div><div class="card"><div class="muted">Факт расходов</div><div class="stat">${fact.toLocaleString("ru-RU")} ₽</div></div></div><div class="card"><div class="row"><h2>Расходы</h2><button onclick="addExpense()">Добавить</button></div>${db.expenses.map((x,i)=>`<div class="item"><div class="row"><b>${e(x.name)}</b><b>${Number(x.amount||0).toLocaleString("ru-RU")} ₽</b></div><div class="muted">${e(x.category)} · ${e(x.date)} ${x.work?"· "+e(x.work):""}</div></div>`).join("")||'<span class="muted">Расходов пока нет</span>'}</div>`}
function journal(a){a.innerHTML=`<div class="card"><div class="row"><h2>Журнал</h2><button onclick="addJournal()">Запись</button></div>${db.journal.map(x=>`<div class="item"><b>${e(x.date)}</b> · ${e(x.worker||"Я")}<div>${e(x.note)}</div>${x.photo?`<img class="photo" src="${x.photo}">`:""}</div>`).join("")||'<span class="muted">Фото и записи появятся здесь.</span>'}</div>`}
function field(label,n,v="",type="text",tag="input"){return `<div class="field"><label>${label}</label>${tag==="textarea"?`<textarea id="f_${n}" rows="3">${e(v)}</textarea>`:`<input id="f_${n}" type="${type}" value="${e(v)}">`}</div>`}function sel(label,n,opts,v){return `<div class="field"><label>${label}</label><select id="f_${n}">${opts.map(o=>`<option ${o===v?"selected":""}>${e(o)}</option>`).join("")}</select></div>`}
function addWork(i=null){let x=i==null?{}:db.works[i];$("sheet").innerHTML=`<h2>${i==null?"Новая работа":"Изменение работы"}</h2>${field("Название","name",x.name)}${sel("Раздел","section",sections,x.section)}${sel("Помещение","room",rooms,x.room)}${sel("Статус","status",statuses,x.status||"Запланировано")}${sel("Приоритет","priority",priorities,x.priority||"Обычный")}${sel("Исполнитель","worker",workers,x.worker||"Я")}${field("Начало","start",x.start,"date")}${field("Окончание","end",x.end,"date")}${field("Плановая стоимость","cost",x.cost||0,"number")}${field("Комментарий","note",x.note,"text","textarea")}<div class="actions"><button class="secondary" onclick="closeM()">Отмена</button><button onclick="saveWork(${i==null?-1:i})">Сохранить</button></div>`;openM()}
function saveWork(i){let x={name:v("name"),section:v("section"),room:v("room"),status:v("status"),priority:v("priority"),worker:v("worker"),start:v("start"),end:v("end"),cost:Number(v("cost")||0),note:v("note")};if(!x.name)return alert("Укажи название");i<0?db.works.push(x):db.works[i]=x;closeM();save()}function delWork(i){if(confirm("Удалить работу?")){db.works.splice(i,1);save()}}
function addMaterial(){ $("sheet").innerHTML=`<h2>Новый материал</h2>${field("Название","name")}${sel("Раздел","section",sections,sections[0])}${field("Количество","qty",1,"number")}${field("Единица","unit","шт.")}${field("Цена за единицу","price",0,"number")}${field("Где купить","shop","")}${field("Комментарий","note","")}<div class="actions"><button class="secondary" onclick="closeM()">Отмена</button><button onclick="saveMaterial()">Сохранить</button></div>`;openM()}
function saveMaterial(){let x={name:v("name"),section:v("section"),qty:Number(v("qty")||0),unit:v("unit"),price:Number(v("price")||0),shop:v("shop"),note:v("note"),purchased:false};if(!x.name)return alert("Укажи материал");db.materials.push(x);closeM();save()}function toggleMat(i){db.materials[i].purchased=!db.materials[i].purchased;save()}function delMat(i){db.materials.splice(i,1);save()}
function addExpense(){ $("sheet").innerHTML=`<h2>Новый расход</h2>${field("Дата","date",new Date().toISOString().slice(0,10),"date")}${field("Категория","category","Материалы")}${field("Название","name")}${field("Сумма","amount",0,"number")}${field("Работа","work","")}${field("Комментарий","note","")}<div class="actions"><button class="secondary" onclick="closeM()">Отмена</button><button onclick="saveExpense()">Сохранить</button></div>`;openM()}
function saveExpense(){let x={date:v("date"),category:v("category"),name:v("name"),amount:Number(v("amount")||0),work:v("work"),note:v("note")};if(!x.name)return alert("Укажи название");db.expenses.push(x);closeM();save()}
function addJournal(){ $("sheet").innerHTML=`<h2>Запись в журнал</h2>${field("Дата","date",new Date().toISOString().slice(0,10),"date")}${sel("Кто","worker",workers,"Я")}${field("Что сделано","note","","text","textarea")}<div class="field"><label>Фото</label><input id="f_photo" type="file" accept="image/*" capture="environment"></div><div class="actions"><button class="secondary" onclick="closeM()">Отмена</button><button onclick="saveJournal()">Сохранить</button></div>`;openM()}
function saveJournal(){let file=$("f_photo").files[0],x={date:v("date"),worker:v("worker"),note:v("note"),photo:""};if(!x.note)return alert("Напиши, что сделано");if(file){let r=new FileReader();r.onload=()=>{x.photo=r.result;db.journal.push(x);closeM();save()};r.readAsDataURL(file)}else{db.journal.push(x);closeM();save()}}
function goSection(s){filter=s;page="works";render()}function quickAdd(){page==="materials"?addMaterial():page==="money"?addExpense():page==="journal"?addJournal():addWork()}function v(n){return $("f_"+n).value}function openM(){$("modal").style.display="flex"}function closeM(){$("modal").style.display="none"}render();
</script></body></html>
